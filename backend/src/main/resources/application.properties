server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iitsm}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiry-minutes=480
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.seed-demo-users=${SEED_DEMO:true}
app.admin.email=${ADMIN_EMAIL:admin@iitsm.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# Email. Leave MAIL_HOST empty to only log emails ("simulated email") instead of sending them.
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:I-ITSM Service Desk <no-reply@iitsm.local>}
app.mail.starttls=${MAIL_STARTTLS:true}
# Require new self-registered employees to confirm their email address before they can sign in.
app.auth.email-verification=${EMAIL_VERIFICATION:true}
app.auth.verification-hours=${VERIFICATION_HOURS:24}
# Used to build the link in the verification email.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.rating.initial=${RATING_INITIAL:4.0}
app.rating.sla-penalty=${RATING_SLA_PENALTY:0.25}
